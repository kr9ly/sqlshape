# Release: push a tag v* and this cross-compiles the sqlshape binary for every platform,
# packs it, and publishes a GitHub Release with checksums.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The binary is a plain Go build (libpg_query runs as WebAssembly, no cgo), so one runner
# builds every target; the smoke test runs the runner's own (linux/amd64) binary as a
# vettool over the examples, the only one it can execute.
#
# `go install github.com/kr9ly/sqlshape/cmd/sqlshape@<tag>` needs nothing from this
# workflow: it reads the tag straight from the module proxy.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            bin=sqlshape; [ "$goos" = windows ] && bin=sqlshape.exe
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/kr9ly/sqlshape/internal/cli.version=${GITHUB_REF_NAME}" \
              -o "build/$goos-$goarch/$bin" ./cmd/sqlshape
            name="sqlshape_${GITHUB_REF_NAME}_${goos}_${goarch}"
            mkdir "$name"
            cp "build/$goos-$goarch/$bin" LICENSE NOTICE README.md "$name"/
            if [ "$goos" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "$name"
          done
          ls -la dist

      - name: Smoke test
        run: .github/scripts/smoke.sh ./build/linux-amd64/sqlshape "$GITHUB_REF_NAME"

      - name: Checksums
        run: cd dist && sha256sum sqlshape_* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac  # v1.0.0-rc.1
          # the release notes are the tag's section of CHANGELOG.md (a candidate v1.1.0-rc.1 reads
          # the 1.1.0 section); generated notes when it has none
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          notes="--generate-notes"
          if grep -q . notes.md; then notes="--notes-file notes.md"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            $notes $pre

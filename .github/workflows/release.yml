# Release: push a tag cmd/sqlshape/v* and this cross-compiles the sqlshape binary for every
# platform, packs it, and publishes a GitHub Release with checksums.
#
#   git tag cmd/sqlshape/v2.0.0 && git push origin cmd/sqlshape/v2.0.0
#
# The binary is the nested module cmd/sqlshape (GPLv2); the runtime is the root module and
# is tagged separately (v1.x.y), as is mysql/ (mysql/v0.x.y). cmd/sqlshape/go.mod names the
# root version it builds against, so tag the root first and bump that require.
#
# The binary is a plain Go build (libpg_query runs as WebAssembly, no cgo), so one runner
# builds every target; the smoke test runs the runner's own (linux/amd64) binary as a
# vettool over the examples, the only one it can execute.
#
# `go install github.com/kr9ly/sqlshape/cmd/sqlshape/v2@<version>` needs nothing from this
# workflow: it reads the tag straight from the module proxy.
name: release

on:
  push:
    tags: ["cmd/sqlshape/v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the version is the tag without the module prefix: cmd/sqlshape/v2.0.0 -> v2.0.0
      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#cmd/sqlshape/}" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            bin=sqlshape; [ "$goos" = windows ] && bin=sqlshape.exe
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/kr9ly/sqlshape/internal/cli.version=${VERSION}" \
              -o "build/$goos-$goarch/$bin" ./cmd/sqlshape
            name="sqlshape_${VERSION}_${goos}_${goarch}"
            mkdir "$name"
            cp "build/$goos-$goarch/$bin" cmd/sqlshape/LICENSE NOTICE README.md "$name"/
            if [ "$goos" = windows ]; then
              zip -qr "dist/$name.zip" "$name"
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "$name"
          done
          ls -la dist

      - name: Smoke test
        run: .github/scripts/smoke.sh ./build/linux-amd64/sqlshape "$VERSION"

      - name: Checksums
        run: cd dist && sha256sum sqlshape_* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac  # v2.0.0-rc.1
          # the release notes are the version's section of CHANGELOG.md (a candidate v2.0.0-rc.1
          # reads the 2.0.0 section); generated notes when it has none
          v="${VERSION#v}"; v="${v%%-*}"
          awk -v v="$v" '/^## \[/ { on = index($0, "[" v "]") > 0; next } on' CHANGELOG.md > notes.md
          notes="--generate-notes"
          if grep -q . notes.md; then notes="--notes-file notes.md"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sqlshape $VERSION" \
            $notes $pre

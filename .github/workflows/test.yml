name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # the coverage badge is committed back to main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pg_dump for the migration side: its major version must be at least the embedded
      # server's (17), which Ubuntu's own packages lag behind
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-17
          # /usr/bin/pg_dump is Ubuntu's wrapper and picks the default (older) cluster version
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      # the embedded PostgreSQL archive, its extracted binaries + initialized template data
      # directory (internal/oracle), and PostgreSQL's regression corpus (TestRegress)
      - name: Cache PostgreSQL binaries and regress corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.embedded-postgres-go
            ~/.cache/sqlshape
          key: sqlshape-pg-${{ hashFiles('internal/oracle/oracle.go', 'internal/analyze/testdata/tools/fetch-regress.sh') }}

      - name: Fetch regress corpus
        run: internal/analyze/testdata/tools/fetch-regress.sh

      # coverage counts every package except the catalog generator (a manual tool run
      # against a PostgreSQL) and the 5-statement main
      - name: Test
        run: |
          pkgs=$(go list ./... | grep -v -e /internal/catalog/gen -e /cmd/sqlshape | paste -sd,)
          go test ./... -coverpkg="$pkgs" -coverprofile=cover.out -timeout 20m

      # coverage badge: statement coverage of the whole module, committed as an SVG so the
      # README can show it without a third-party service; --min makes it a regression gate
      - name: Coverage badge
        run: python3 .github/scripts/coverage_badge.py --min 75 cover.out .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          if ! git diff --cached --quiet; then
            git commit -m "CI: coverage badge [skip ci]"
            git push
          fi
